name=mongo-source
connector.class=com.mongodb.kafka.connect.MongoSourceConnector
tasks.max=1

# Connection and source configuration
connection.uri=mongodb://mongo1:27017,mongo2:27017,mongo3:27017
database=test
collection=source

topic.prefix=
topic.suffix=
poll.max.batch.size=1000
poll.await.time.ms=5000

# The default offset partition includes the seed hosts in connection.uri.
# The driver sorts those hosts, so order does not matter, but a changed host
# list is a different partition and the task starts from startup.mode.
# Pin the partition with offset.partition.name. After the first offset is
# stored, offset.fail.on.missing=true fails the task instead of starting over.
# offset.partition.name=
# offset.fail.on.missing=false

# Change stream options
pipeline=[]
batch.size=0
change.stream.full.document=updateLookup
collation=
